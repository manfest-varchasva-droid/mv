name: Build and Deploy BigRock Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigrock-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      STATIC_EXPORT: "1"

    steps:
      - name: Get website code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Remove non-production routes and unused raw event copies
        run: |
          rm -rf out/raw-events
          rm -rf out/selections-2026

      - name: Generate lightweight WebP images
        run: node scripts/optimize-static-images.mjs out

      - name: Add BigRock SEO, redirect, image and cache rules
        run: |
          cat > out/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
            RewriteEngine On

            # Consolidate old Joomla page URLs into the current Next.js site.
            RewriteRule ^index\.php/?$ / [R=301,L,NC]
            RewriteRule ^index\.php/about(?:/.*)?$ /about/ [R=301,L,NC]
            RewriteRule ^index\.php/events(?:/.*)?$ /events/ [R=301,L,NC]
            RewriteRule ^index\.php/gallery(?:/.*)?$ /gallery/ [R=301,L,NC]
            RewriteRule ^index\.php/(?:partners|sponsors)(?:/.*)?$ /partners/ [R=301,L,NC]
            RewriteRule ^index\.php/city-run(?:/.*)?$ /city-run/ [R=301,L,NC]

            # Any remaining Joomla route has been superseded by the current site.
            RewriteRule ^index\.php/.*$ / [R=301,L,NC]

            # Transparently serve generated WebP versions to browsers that support them.
            RewriteCond %{HTTP_ACCEPT} image/webp [NC]
            RewriteCond %{REQUEST_FILENAME}.webp -f
            RewriteRule ^(.+\.(?:jpe?g|png))$ $1.webp [T=image/webp,L,NC]
          </IfModule>

          <IfModule mod_setenvif.c>
            # Keep legacy selection/rulebook files accessible, but remove them from search results.
            SetEnvIf Request_URI "^/images/(?:Selection[0-9]{4}|rulebooks)/" legacy_archive=1
          </IfModule>

          <IfModule mod_mime.c>
            AddType image/webp .webp
          </IfModule>

          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, noarchive" env=legacy_archive

            <FilesMatch "\.(?:jpe?g|png)$">
              Header append Vary Accept
            </FilesMatch>

            <FilesMatch "\.(?:jpg|jpeg|png|webp|gif|svg)$">
              Header set Cache-Control "public, max-age=604800"
            </FilesMatch>

            <FilesMatch "\.(?:js|css|woff2)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>

            <FilesMatch "\.(?:html|txt|xml)$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          HTACCESS

      - name: Keep downloadable backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: manfest-bigrock-site
          path: out/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy website to BigRock
        env:
          BIGROCK_FTP_HOST: ${{ secrets.BIGROCK_FTP_HOST }}
          BIGROCK_FTP_USER: ${{ secrets.BIGROCK_FTP_USER }}
          BIGROCK_FTP_PASSWORD: ${{ secrets.BIGROCK_FTP_PASSWORD }}
        run: |
          lftp -u "$BIGROCK_FTP_USER","$BIGROCK_FTP_PASSWORD" "ftp://$BIGROCK_FTP_HOST" <<'LFTP_CMDS'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-auth TLS
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 --only-newer out/ ./
          rm -r -f selections-2026
          bye
          LFTP_CMDS
