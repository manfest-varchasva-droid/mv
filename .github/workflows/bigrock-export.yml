name: Build and Deploy BigRock Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigrock-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      STATIC_EXPORT: "1"

    steps:
      - name: Get website code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove non-production assets before build
        run: |
          rm -rf public/raw-events
          rm -rf public/selections-2026

      - name: Build static website
        run: npm run build

      - name: Remove non-production routes
        run: |
          rm -rf out/raw-events
          rm -rf out/selections-2026

      - name: Generate lightweight WebP images
        run: node scripts/optimize-static-images.mjs out

      - name: Add BigRock SEO, redirect, image and cache rules
        run: |
          cat > out/.htaccess <<'HTACCESS'
          ErrorDocument 404 /404.html

          <IfModule mod_rewrite.c>
            RewriteEngine On

            # BEGIN SEO MIGRATION 2026-10-28: exact replacements before host redirects
            # Do not send unrelated retired URLs to the homepage.
            # These legacy paths have been permanently withdrawn from publication.
            RewriteRule ^(?:new/)?selections-2026(?:/.*)?$ - [G,L,NC]

            # Obsolete /new/ copies: redirect only known current routes.
            RewriteRule ^new/events/(campus-ambassador|vibes|imperio|duex-danza|taal|jashn|antarnaad|halla-bol|izhaar|stairway-to-hell|sur|the-joust|rohan|iim-lucknow-mun|young-leaders-programme)/?$ https://iiml-manfestvarchasva.com/events/$1/ [R=301,L,NC,NE]
            RewriteRule ^new/(about|events|gallery|partners|city-run|terms-and-conditions)/?$ https://iiml-manfestvarchasva.com/$1/ [R=301,L,NC,NE]
            # Older /new/ copies of published rulebooks and selections have an /images/ equivalent.
            RewriteRule ^new/images/(Selection[0-9]{4}|rulebooks)/(.+)$ https://iiml-manfestvarchasva.com/images/$1/$2 [R=301,L,NC,NE]

            # Joomla homepage and primary public navigation: exact matches only.
            RewriteRule ^index\.php(?:/index\.php)?/?$ https://iiml-manfestvarchasva.com/ [R=301,L,NC,NE]
            RewriteRule ^index/?$ https://iiml-manfestvarchasva.com/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/about(?:-us)?/?$ https://iiml-manfestvarchasva.com/about/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/(?:our-partners|partners|sponsors)/?$ https://iiml-manfestvarchasva.com/partners/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/city-run/?$ https://iiml-manfestvarchasva.com/city-run/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/gallery/?$ https://iiml-manfestvarchasva.com/gallery/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/?$ https://iiml-manfestvarchasva.com/events/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/(?:cultural-events|culturalevents|management-events)/?$ https://iiml-manfestvarchasva.com/events/ [R=301,L,NC,NE]

            # Joomla competitions with genuine current archive/detail equivalents.
            RewriteRule ^index\.php/events/(?:cultural-events|culturalevents)/theatre/(antarnaad|halla-bol|izhaar)/?$ https://iiml-manfestvarchasva.com/events/$1/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/(?:cultural-events|culturalevents)/dance/(vibes|imperio|duex-danza|taal)/?$ https://iiml-manfestvarchasva.com/events/$1/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/(?:cultural-events|culturalevents)/fashion-parade/jashn/?$ https://iiml-manfestvarchasva.com/events/jashn/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/(?:cultural-events|culturalevents)/music/(sur|stairway-to-hell)/?$ https://iiml-manfestvarchasva.com/events/$1/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/(?:cultural-events|culturalevents)/literary/joust/?$ https://iiml-manfestvarchasva.com/events/the-joust/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/(?:cultural-events|culturalevents)/literary/rohan/?$ https://iiml-manfestvarchasva.com/events/rohan/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/iiml-mun/?$ https://iiml-manfestvarchasva.com/events/iim-lucknow-mun/ [R=301,L,NC,NE]
            RewriteRule ^index\.php/events/leaders-express/ylp/?$ https://iiml-manfestvarchasva.com/events/young-leaders-programme/ [R=301,L,NC,NE]

            # Drupal-era aliases with clearly equivalent present-day information.
            RewriteRule ^pages/about/?$ https://iiml-manfestvarchasva.com/about/ [R=301,L,NC,NE]
            RewriteRule ^content/lucknow-city-run/?$ https://iiml-manfestvarchasva.com/city-run/ [R=301,L,NC,NE]
            RewriteRule ^content/jashn-fashion-parade/?$ https://iiml-manfestvarchasva.com/events/jashn/ [R=301,L,NC,NE]
            RewriteRule ^content/(?:ylp|registration-young-leaders-program)/?$ https://iiml-manfestvarchasva.com/events/young-leaders-programme/ [R=301,L,NC,NE]
            RewriteRule ^event/dance/vibes/?$ https://iiml-manfestvarchasva.com/events/vibes/ [R=301,L,NC,NE]
            RewriteRule ^event/theatre/hallabol/?$ https://iiml-manfestvarchasva.com/events/halla-bol/ [R=301,L,NC,NE]

            # The old Joomla catch-all redirected unrelated pages to Home, causing soft-404s.
            # Unmatched Joomla pages have no true replacement: report Gone, not a fake success.
            RewriteRule ^index\.php(?:/.*)?$ - [G,L,NC]
            # END SEO MIGRATION 2026-10-28

            # Canonical origin: normalize only after known legacy aliases, avoiding two-hop redirects.
            RewriteCond %{HTTP_HOST} !^iiml-manfestvarchasva\.com$ [NC]
            RewriteRule ^ https://iiml-manfestvarchasva.com%{REQUEST_URI} [R=301,L,NE]
            RewriteCond %{HTTPS} !=on
            RewriteCond %{HTTP:X-Forwarded-Proto} !https [NC]
            RewriteRule ^ https://iiml-manfestvarchasva.com%{REQUEST_URI} [R=301,L,NE]

            # Transparently serve generated WebP versions to browsers that support them.
            RewriteCond %{HTTP_ACCEPT} image/webp [NC]
            RewriteCond %{REQUEST_FILENAME}.webp -f
            RewriteRule ^(.+\.(?:jpe?g|png))$ $1.webp [T=image/webp,L,NC]
          </IfModule>

          <IfModule mod_setenvif.c>
            # Keep legacy selection/rulebook files downloadable, but not indexed.
            SetEnvIfNoCase Request_URI "^/images/(?:Selection[0-9]{4}|rulebooks)/" legacy_archive=1
            # Mailing-list archives may exist on this vhost; indexing is never a substitute for access controls.
            SetEnvIfNoCase Request_URI "^/(?:pipermail|mailman|webmail)/" legacy_archive=1
          </IfModule>

          <IfModule mod_mime.c>
            AddType image/webp .webp
          </IfModule>

          <IfModule mod_brotli.c>
            AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
          </IfModule>

          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, noarchive" env=legacy_archive

            # Production security and privacy headers.
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
            Header always set Strict-Transport-Security "max-age=31536000"

            <FilesMatch "\.(?:jpe?g|png)$">
              Header append Vary Accept
            </FilesMatch>

            <FilesMatch "\.(?:jpg|jpeg|png|webp|gif|svg)$">
              Header set Cache-Control "public, max-age=604800"
            </FilesMatch>

            <FilesMatch "\.(?:js|css|woff2)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>

            <FilesMatch "\.(?:html|txt|xml)$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          HTACCESS
          node scripts/verify-seo-migration.mjs --generated

      - name: Keep downloadable backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: manfest-bigrock-site
          path: out/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy website to BigRock
        env:
          BIGROCK_FTP_HOST: ${{ secrets.BIGROCK_FTP_HOST }}
          BIGROCK_FTP_USER: ${{ secrets.BIGROCK_FTP_USER }}
          BIGROCK_FTP_PASSWORD: ${{ secrets.BIGROCK_FTP_PASSWORD }}
        run: |
          lftp -u "$BIGROCK_FTP_USER","$BIGROCK_FTP_PASSWORD" "ftp://$BIGROCK_FTP_HOST" <<'LFTP_CMDS'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-auth TLS
          set ftp:passive-mode true
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 --only-newer out/ ./
          rm -r -f selections-2026
          bye
          LFTP_CMDS
