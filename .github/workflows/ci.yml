name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: node scripts/verify-seo-migration.mjs
      - run: npm ci
      - run: STATIC_EXPORT=1 npm run build
      - run: node scripts/verify-search-visibility.mjs
